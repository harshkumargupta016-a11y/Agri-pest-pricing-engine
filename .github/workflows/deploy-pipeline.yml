name: Production Container CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    # Grant necessary permissions to push to GitHub Packages
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # Dynamically tags the image with your repository name
        tags: ghcr.io/${{ github.repository }}/agri-pest-engine:latest
