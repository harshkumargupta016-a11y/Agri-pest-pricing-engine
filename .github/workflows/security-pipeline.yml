name: Security Audit and Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  security-audit:
    name: Dependency and code audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
      - name: Install security scanners in isolation
        run: |
          python -m venv .security-venv
          .security-venv/bin/python -m pip install --upgrade pip
          .security-venv/bin/python -m pip install bandit==1.9.4 safety==3.8.1
      - name: Run Safety
        run: .security-venv/bin/safety check --full-report -r requirements.txt
      - name: Run Bandit
        run: .security-venv/bin/bandit -r api/ pipeline/ -ll -ii
