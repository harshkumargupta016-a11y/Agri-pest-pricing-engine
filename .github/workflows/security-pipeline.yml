name: Security Audit & Vulnerability Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install Dependencies & Scanners
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Safety (Dependency Vulnerability Scanner)
      run: |
        # Checks installed packages against known CVEs (Common Vulnerabilities and Exposures)
        safety check -r requirements.txt || true
        
    - name: Run Bandit (Code Vulnerability Scanner)
      run: |
        # Scans the API directory for hardcoded secrets, injection flaws, and bad practices
        bandit -r api/ -ll -ii
name: Security Audit and Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency and code audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install security scanners in isolation
        run: |
          python -m venv .security-venv
          .security-venv/bin/python -m pip install bandit==1.9.4 safety==3.8.1
      - name: Run Safety
        run: .security-venv/bin/safety check --full-report -r requirements.txt
      - name: Run Bandit
        run: .security-venv/bin/bandit -r api/ pipeline/ -ll -ii
